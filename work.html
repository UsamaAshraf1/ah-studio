    <script>
      // Menu overlay
      const menu = document.getElementById("menu");
      const btn = document.getElementById("menuBtn");
      const setMenu = (open) => {
        menu.classList.toggle("hidden", !open);
        menu.classList.toggle("flex", open);
        btn.setAttribute("aria-expanded", open);
      };
      btn.addEventListener("click", () => setMenu(true));
      document
        .getElementById("menuClose")
        .addEventListener("click", () => setMenu(false));
      document.addEventListener(
        "keydown",
        (e) => e.key === "Escape" && setMenu(false),
      );

      // Project list: the hovered / focused row turns black, shows the arrow,
      // and the tilted preview moves to sit on it.
      const list = document.getElementById("workList");
      const rows = [...list.querySelectorAll("li")];
      const preview = document.getElementById("preview");
      const on = ["bg-black", "text-white"];

      function activate(li) {
        rows.forEach((r) => {
          const a = r.querySelector(".work-row");
          const arrow = r.querySelector(".work-arrow");
          const isOn = r === li;
          a.classList.toggle("bg-black", isOn);
          a.classList.toggle("text-white", isOn);
          arrow.classList.toggle("hidden", !isOn);
          r.classList.toggle("border-b", !isOn);
          r.classList.toggle("border-neutral-200", !isOn);
        });
        preview.style.top = li.offsetTop + "px";
      }
      rows.forEach((li) => {
        li.addEventListener("mouseenter", () => activate(li));
        li.querySelector("a").addEventListener("focus", () => activate(li));
      });
      activate(rows[0]);
      window.addEventListener("resize", () => {
        const current = rows.find((r) =>
          r.querySelector(".work-row").classList.contains("bg-black"),
        );
        if (current) activate(current);
      });
    </script>
